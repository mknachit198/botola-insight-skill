name: Tests publics
on: [push, pull_request]
permissions:
  contents: read
jobs:
  commands:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python tools/check_package.py
# La reproduction intégrale nécessite les données privées externes et ne tourne
# pas sur un runner public. La CI ci-dessus n'est pas une mesure de précision vidéo.
